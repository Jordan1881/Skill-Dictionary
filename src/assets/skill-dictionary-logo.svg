      <circle cx="100" cy="92" r="3.6" fill="#b8913c"></circle>

      
      <path d="M 100 100 L 100 158 L 44 150 L 44 96 Z" fill="#f6f1e9" stroke="#1e1008" stroke-width="1.2" stroke-linejoin="round"></path>
      <path d="M 100 100 L 100 158 L 156 150 L 156 96 Z" fill="#f6f1e9" stroke="#1e1008" stroke-width="1.2" stroke-linejoin="round"></path>

      
