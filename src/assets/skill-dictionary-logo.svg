      <textPath href="#top-arc" startOffset="50%" text-anchor="middle">· EX LIBRIS · ARTIFICII ·</textPath>
    </text>
    
    <text fill="#b8913c" font-weight="600" font-size="10" letter-spacing="3" font-style="italic" font-family="&#39;Cormorant Garamond&#39;, serif">
      <textPath href="#bot-arc" startOffset="50%" text-anchor="middle">ANNO  MMXXVI</textPath>
    </text>

    
    <circle cx="40" cy="160" r="2" fill="#b8913c"></circle>
    <circle cx="280" cy="160" r="2" fill="#b8913c"></circle>

    
